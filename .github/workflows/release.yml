name: Release

on:
  push:
    tags:
      # Only trigger the workflow for tags that match the pattern "producer-v*.*.*" or "consumer-v*.*.*"
      - "producer-v*.*.*"
      - "consumer-v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # permits the read and write access to the repository contents, allowing the workflow to push changes back to the repository
      packages: write # permits the workflow to publish and update packages in the GitHub Package Registry

    steps:
      - uses: actions/checkout@v4
        # actions/checkout@v4 is used to checkout the repository so that the workflow can access the code and files in the repository
        with:
          fetch-depth: 0

      - name: Parse tag
        id: parse
        # In Github Actions, the var GITHUB_REF contains the full reference of the tag that triggered the workflow, so it appears like "refs/tags/producer-v1.0.0" or "refs/tags/consumer-v1.0.0"
        # note for myself: #... keeps the part of the string after the last occurrence of ...
        # note for myself: %%... keeps the part of the string before the last occurrence of ...
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COMPONENT="${TAG%%-v*}"
          VERSION="v${TAG#*-v}"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # builds and pushes the Docker image for the specified component (producer or consumer) to ghcr
        uses: docker/build-push-action@v5
        with:
          context: apps/${{ steps.parse.outputs.component }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.parse.outputs.component }}:${{ steps.parse.outputs.version }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tag
        working-directory: k8s/overlays/prod
        #example: kustomize edit set image ghcr.io/elyas-gitspace/producer=ghcr.io/elyas-gitspace/producer:v1.0.0
        run: |
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/${{ steps.parse.outputs.component }}=ghcr.io/${{ github.repository_owner }}/${{ steps.parse.outputs.component }}:${{ steps.parse.outputs.version }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "chore(release): ${{ steps.parse.outputs.component }} ${{ steps.parse.outputs.version }}"
          git push origin HEAD:main
