name: PR Checks

on:
  pull_request:
    branches: [main]

# go-checks and k8s-checks jobs will be triggered only if changes job detects changes in the corresponding directories
jobs:
  changes: # checks for changes in apps (golang)and k8s directories
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'apps/**'
            k8s:
              - 'k8s/**'

  go-checks:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # If changes are detected in the apps directory, run go-checks job for both producer and consumer components
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [producer, consumer]
    defaults:
      run:
        working-directory: apps/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
        # actions/checkout@v4 is used to checkout the repository so that the workflow can access the code and files in the repository

      - uses: actions/setup-go@v5
        # sets up the Go environment for the workflow, allowing it to run Go commands and tests
        with:
          go-version: "1.22"
          cache-dependency-path: apps/${{ matrix.component }}/go.sum

      - name: Lint
        # runs golangci-lint to check for code quality and style issues in the Go code of the specified component (producer or consumer)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: apps/${{ matrix.component }}
          version: latest

      - name: Test
        # runs tests for the Go code of the specified component (producer or consumer)
        run: go test ./...

      - name: Build
        # builds the Go code of the specified component (producer or consumer). It checks that the code compiles successfully and produces the expected binaries or artifacts
        run: go build ./...

  k8s-checks:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    # If changes are detected in the k8s directory, run k8s-checks job to validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # actions/checkout@v4 is used to checkout the repository so that the workflow can access the code and files in the repository

      - name: Install kustomize
        # installs kustomize, a tool for customizing Kubernetes configurations
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        # installs kubeconform, a tool for validating Kubernetes manifests
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Build manifests (kustomize)
        # builds the Kubernetes manifests using kustomize for the production overlay
        run: kustomize build k8s/overlays/prod > /tmp/manifests.yaml

      - name: Validate manifests (kubeconform)
        # validates the generated Kubernetes manifests using kubeconform
        run: kubeconform -strict -summary -ignore-missing-schemas /tmp/manifests.yaml
